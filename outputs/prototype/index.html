<!doctype html>
<html lang="zh-CN" data-theme="light" data-glass="on" data-size="phone">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短剧聚合 · 设计原型 v2</title>
<style>
:root{
  --bg:#ffffff; --ink:#0f0f0f; --graphite:#6e6e80; --silver:#8f8f8f;
  --hairline:#e5e5e5; --mist:#f7f7f8; --elevated:#ffffff;
  --glass-fill:rgba(255,255,255,.70); --glass-line:rgba(255,255,255,.70);
  --glass-shadow:0 6px 24px rgba(0,0,0,.10);
  --ink-pill:#0f0f0f; --on-ink:#ffffff;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --dur:280ms; --ease:cubic-bezier(.32,.72,0,1);
}
html[data-theme=dark]{
  --bg:#1c1c1e; --ink:#ececec; --graphite:#b4b4b4; --silver:#8e8e8e;
  --hairline:#38383a; --mist:#171717; --elevated:#2c2c2e;
  --glass-fill:rgba(40,40,42,.62); --glass-line:rgba(255,255,255,.14);
  --glass-shadow:0 6px 24px rgba(0,0,0,.50);
  --ink-pill:#ececec; --on-ink:#101010;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 图标基线：默认线稿（SF Symbols 的 outline 变体），.f 为实心（.fill 变体）。
   选中态靠两者切换表达——这是 UITabBar 的语言，不是 Material 的指示器。 */
svg{width:1em;height:1em;flex:none;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;
  background:#f2f1ee; color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:22px 18px 44px; font-size:15px; line-height:1.5;
}
html[data-theme=dark] body{background:#0f0f10}

.bar{width:100%;max-width:1180px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.bar h1{font-size:15px;font-weight:600}
.bar .sp{flex:1}
.seg{display:flex;background:var(--mist);border-radius:9px;padding:2px;gap:2px}
html[data-theme=dark] .seg{background:#2a2a2c}
.seg button{border:0;background:transparent;color:var(--graphite);font:inherit;font-size:12.5px;
  padding:5px 10px;border-radius:7px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
html[data-theme=dark] .seg button[aria-pressed=true]{background:#3a3a3c}
.seg button:hover{color:var(--ink)}

.stage{width:100%;max-width:1180px;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.device{width:var(--dw,390px);height:var(--dh,844px);background:#101014;border-radius:44px;padding:10px;
  box-shadow:0 30px 70px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.10) inset;
  transition:width var(--dur) var(--ease),height var(--dur) var(--ease);flex:none}
.screen{width:100%;height:100%;border-radius:35px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink)}
html[data-size=tablet] .device{border-radius:26px;padding:12px}
html[data-size=tablet] .screen{border-radius:16px}
html[data-size=desktop] .device{border-radius:12px;padding:8px;background:#1a1a20}
html[data-size=desktop] .screen{border-radius:6px}
.caption{font-size:12.5px;color:#8b8a85}
html[data-theme=dark] .caption{color:#6e6e72}

/* ── 外壳与导航 ─────────────────────────── */
.shell{position:absolute;inset:0}
.shell .content{position:absolute;inset:0}
/* 侧栏浮起，内容从它右侧让开（绝对定位子元素的包含块是 padding box，
   所以这里直接给 .page 设 left，而不是给 .content 加 padding）。
   注意：.page 的 inset:0 必须先声明，否则会覆盖下面的 left。
   topbar / subbar 是 .page 的子元素，.page 让开后它们自动跟着让开。 */
.page{position:absolute;inset:0;display:none;flex-direction:column}
.shell.hasrail .page{left:var(--railpad,0px)}
.page.on{display:flex}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:0 var(--gut,16px)}
/* 宽屏限宽居中。列表类内容读的是「一行一件事」，取 760；网格类内容取 1120。
   padding 与 max-width 放在同一个元素上（box-sizing 已是 border-box），
   这样 max-width 把 padding 一起包住，margin:auto 才真正居中。 */
.col{max-width:calc(var(--colw,760px) + var(--gut,16px)*2);margin:0 auto;width:100%}

.glass{background:var(--glass-fill);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow)}
html[data-glass=off] .glass{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;
  border-color:var(--hairline);box-shadow:none}

/* 底部 Tab：iOS 26 浮起玻璃胶囊。不贴底边、不选中药丸、不画指示器圆点，
   选中态靠图标线稿→实心 + 文字着色（UITabBar 的语言） */
.tabbar{position:absolute;left:14px;right:14px;bottom:16px;height:60px;z-index:40;border-radius:30px;
  display:flex;align-items:center;padding:0 4px}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;border:0;background:transparent;font:inherit;color:var(--graphite)}
.tab svg{width:23px;height:23px}
.tab svg.o{stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab svg.f{stroke:none;fill:currentColor}
.tab span{font-size:10.5px;font-weight:500;letter-spacing:.1px}
.tab[aria-current=true]{color:var(--ink)}
.tab[aria-current=true] span{font-weight:600}

/* iPadOS 侧栏：浮于内容之上的一层圆角矩形液态玻璃。
   不贴屏幕边、不占整块高度分区——是「一片浮起的玻璃」，不是「一条竖切的颜色块」。 */
.rail{position:absolute;left:12px;top:12px;bottom:12px;z-index:50;border-radius:26px;
  width:var(--railw,200px);display:flex;flex-direction:column;gap:2px;padding:16px 12px;
  background:var(--glass-fill);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow);overflow:hidden}
html[data-glass=off] .rail{background:var(--mist);border-color:var(--hairline);box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
.rail.medium{--railw:200px}
.rail.wide{--railw:240px}
.rail-brand{font-size:22px;font-weight:700;letter-spacing:-.5px;padding:6px 12px 18px;color:var(--ink)}
.rail-searchrow{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:10px;
  background:var(--mist);color:var(--graphite);font-size:14.5px;margin-bottom:16px;cursor:pointer;flex:none}
.rail-searchrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.rail-item{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:12px;border:0;
  background:transparent;color:var(--ink);font:inherit;font-size:15.5px;cursor:pointer;text-align:left;width:100%}
.rail-item svg{width:20px;height:20px;flex:none}
.rail-item svg.o{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail-item svg.f{stroke:none;fill:currentColor}
.rail-item[aria-current=true]{background:var(--mist);font-weight:600}
.rail-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px}

/* ── 固定顶栏（Tab 页） ─────────────────────────
   不随滚动改变形态：高度、字号、内边距全程不变。栏体常驻玻璃，
   因为内容确实从它下方滚过——这是玻璃成立的条件。 */
.topbar{position:absolute;top:0;left:0;right:0;z-index:30;
  height:var(--toph,56px);padding:0 var(--gut,16px);
  display:flex;align-items:center;gap:10px;
  background:var(--glass-fill);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--hairline)}
html[data-glass=off] .topbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
/* 大标题样式：桌面档把标题放大一档，其余完全一致 */
.topbar h2{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.2;flex:1}
.topbar .rnd{width:32px;height:32px}
.topbar .rnd svg{width:16px;height:16px}
.topbar .rnd.plain{background:var(--mist)}
.topbar .sep{width:.5px;height:18px;background:var(--hairline);flex:none;margin:0 2px}
html[data-size=desktop] .topbar{--toph:60px}
html[data-size=desktop] .topbar h2{font-size:22px;letter-spacing:-.6px}
/* 顶栏下的副行（分段控件 / 榜单维度 / 筛选摘要），同样常驻。
   topbar / subbar 都是 .page 的子元素，.page 已按侧栏让位，无需各自处理。 */
.subbar{position:absolute;top:var(--toph,56px);left:0;right:0;z-index:29;
  padding:9px var(--gut,16px) 10px;background:var(--glass-fill);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:.5px solid var(--hairline)}
html[data-glass=off] .subbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.subbar::after{content:'';position:absolute;top:100%;left:0;right:0;height:10px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.045),transparent)}
html[data-theme=dark] .subbar::after{background:linear-gradient(to bottom,rgba(0,0,0,.30),transparent)}
/* 列表/网格内容从顶栏 + 副行下方开始 */
.pad.body{padding-top:var(--bodypad,66px)}
/* 返回顶部：滚过一屏后才出现 */
.totop{position:absolute;right:var(--gut,16px);bottom:calc(96px + 16px);z-index:35;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:var(--glass-fill);-webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);border:.5px solid var(--glass-line);
  box-shadow:var(--glass-shadow);opacity:0;pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);transform:translateY(8px)}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2}
html[data-glass=off] .totop{background:var(--mist);border-color:var(--hairline);box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
html[data-size=desktop] .totop,html[data-size=tablet] .totop{bottom:24px}
/* 原型内的轻提示：点了没实现的控件时给反馈，避免看起来是坏了 */
.toast{position:absolute;left:50%;bottom:calc(96px + 26px);transform:translate(-50%,10px);
  z-index:80;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:rgba(20,20,22,.86);color:#fff;white-space:nowrap;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  opacity:0;pointer-events:none;transition:opacity 200ms ease,transform 200ms ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rnd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
/* 纯色页面上的按钮：用浅雾底而不是玻璃——玻璃压在纯色上只会发灰 */
.rnd.plain{background:var(--mist)}
html[data-theme=dark] .rnd.plain{background:#2a2a2c}
.srow{display:flex;gap:8px;align-items:center}
.srow .searchbar{flex:1;min-width:0}
.rnd svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-clear{flex:none}

/* ── 卡片网格 ───────────────────────── */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:12px}
.card{cursor:pointer}
.cover{position:relative;border-radius:13px;overflow:hidden;aspect-ratio:3/4;background:var(--mist)}
.cover-art{position:absolute;inset:0;
  background:radial-gradient(105% 68% at 74% 6%,rgba(255,255,255,.32),transparent 60%),
             linear-gradient(168deg,var(--c1) 0%,var(--c2) 100%)}
.cover-art::after{content:'';position:absolute;left:50%;bottom:-8%;width:66%;height:54%;
  transform:translateX(-50%);background:rgba(0,0,0,.20);border-radius:50% 50% 0 0;filter:blur(3px)}
.cover-scrim{position:absolute;left:0;right:0;bottom:0;height:58%;
  background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.40) 44%,transparent 100%)}
.cover-meta{position:absolute;left:9px;right:9px;bottom:9px;color:#fff}
.cover-title{font-size:12.5px;font-weight:600;line-height:1.3;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.cover-sub{font-size:10px;color:rgba(255,255,255,.80);margin-top:3px;font-family:var(--mono)}
.cover-badge{position:absolute;left:8px;top:8px;font-size:10px;font-weight:600;padding:3px 6px;border-radius:6px;
  background:rgba(0,0,0,.42);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prog{position:absolute;left:9px;right:9px;bottom:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.30);overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:2px}
.resume{position:absolute;right:8px;top:8px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:7px;
  background:rgba(255,255,255,.92);color:#0f0f0f}

/* ── 通用件 ───────────────────────── */
.pill{height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:0 20px;font-size:15px;font-weight:600;border:0;cursor:pointer;font-family:inherit;
  background:var(--ink-pill);color:var(--on-ink)}
.pill.ghost{background:transparent;color:var(--ink);border:.5px solid var(--hairline)}
.pill.sm{height:36px;font-size:13px;padding:0 15px}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:currentColor;stroke-width:0}
.sec{font-size:13px;font-weight:600;color:var(--graphite);margin:22px 0 10px}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 13px;border-radius:999px;background:var(--mist);
  color:var(--graphite);font-size:12.5px;font-weight:500;cursor:pointer;border:0;font-family:inherit}
.chip.on{background:var(--ink-pill);color:var(--on-ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 榜单 / 追剧 / 我的 ───────────────────────── */
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--hairline);cursor:pointer}
.rank-n{width:36px;font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-1.5px;color:var(--silver);flex:none}
.rank-row:nth-child(1) .rank-n,.rank-row:nth-child(2) .rank-n,.rank-row:nth-child(3) .rank-n{color:var(--ink)}
.rank-thumb{width:50px;height:68px;border-radius:9px;overflow:hidden;flex:none;position:relative}
.rank-info{flex:1;min-width:0}
.rank-info .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-info .s{font-size:11px;color:var(--graphite);margin-top:3px;font-family:var(--mono)}
.rank-hot{font-size:11px;color:var(--silver);font-family:var(--mono);flex:none}
/* 榜单维度：日 / 周 / 月。不是分段控件，是文字标签的选中态——
   榜单页的主角是名次，维度切换不该比它更重。 */
.tabsline{display:flex;gap:20px}
.tabsline button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;
  color:var(--silver);cursor:pointer;padding:0 0 1px;position:relative}
.tabsline button[aria-pressed=true]{color:var(--ink);font-weight:650}
.tabsline button[aria-pressed=true]::after{content:'';position:absolute;left:0;right:0;bottom:-4px;
  height:2px;border-radius:2px;background:var(--ink)}
/* 空态：一集没追时不留白屏 */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:64px 24px;text-align:center}
.empty .ic{width:52px;height:52px;border-radius:50%;background:var(--mist);display:grid;place-items:center;margin-bottom:16px}
.empty .ic svg{width:24px;height:24px;stroke:var(--silver);stroke-width:1.6}
.empty .t{font-size:15px;font-weight:600}
.empty .s{font-size:12.5px;color:var(--graphite);margin-top:6px;line-height:1.6;max-width:230px}
.empty .pill{margin-top:20px}
/* 我的页：身份行 + 设置分组 */
.identity{display:flex;align-items:center;gap:14px;padding:4px 0 2px}
.avatar{width:58px;height:58px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:radial-gradient(120% 120% at 30% 12%,#5b5b63,#232326)}
.avatar span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:21px;font-weight:600;
  letter-spacing:-.5px}
.identity .who{flex:1;min-width:0}
.identity .who .n{font-size:19px;font-weight:650;letter-spacing:-.3px}
.identity .who .d{font-size:11.5px;color:var(--graphite);margin-top:4px;font-family:var(--mono)}
.vip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;
  background:var(--ink-pill);color:var(--on-ink);font-size:11.5px;font-weight:600;flex:none}
.vip svg{width:12px;height:12px}
.listcard{background:var(--mist);border-radius:14px;overflow:hidden}
html[data-theme=dark] .listcard{background:#232325}
.listcard .row{border-bottom:.5px solid var(--hairline)}
.listcard .row:last-child{border-bottom:0}
.row .lead{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:var(--elevated)}
html[data-theme=dark] .row .lead{background:#3a3a3c}
.row .lead svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.7}
.row .tx{font-size:14.5px}
.row .val{font-size:12.5px;color:var(--silver);font-family:var(--mono);margin-left:auto}
.row .chev{margin-left:auto;color:var(--silver)}
.row .chev svg{width:16px;height:16px;stroke:currentColor;stroke-width:2}
.segmented{display:flex;background:var(--mist);border-radius:10px;padding:2px;gap:2px}
.segmented button{flex:1;height:32px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;
  color:var(--graphite);border-radius:8px;cursor:pointer}
.segmented button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
html[data-theme=dark] .segmented button[aria-pressed=true]{background:#3a3a3c}
.follow-row{display:flex;gap:12px;padding:13px 0;border-bottom:.5px solid var(--hairline);cursor:pointer;align-items:center}
.follow-thumb{width:56px;height:76px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.follow-body{flex:1;min-width:0}
.follow-body .t{font-size:14.5px;font-weight:600}
.follow-body .s{font-size:11px;color:var(--graphite);margin-top:3px;font-family:var(--mono)}
.follow-prog{margin-top:9px;height:2px;border-radius:2px;background:var(--hairline);overflow:hidden}
.follow-prog i{display:block;height:100%;background:var(--ink);border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--mist);border-radius:14px;padding:14px 12px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.6px}
.stat span{font-size:11.5px;color:var(--graphite);margin-top:2px;display:block}
.list{margin-top:22px;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:.5px solid var(--hairline);cursor:pointer}
.row:last-child{border-bottom:0}
.row .ico{width:29px;height:29px;border-radius:8px;background:var(--mist);display:grid;place-items:center;flex:none}
.row .ico svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row .lb{flex:1;font-size:14.5px;font-weight:500}

/* ── 响应式密度（Kazumi 式连续公式） ─────────────── */
function sizeKey(){ return document.documentElement.dataset.size; }
/// 侧栏玻璃片本身宽度（浮起，左侧留 12、与内容再留 12）
function railW(){ const s=sizeKey(); return s==='desktop'?240:(s==='tablet'?200:0); }
function railWidth(){ const w=railW(); return w>0 ? w+24 : 0; }
function gutter(){ const s=sizeKey(); return s==='desktop'?34:(s==='tablet'?24:16); }
/// 网格最大宽（与 CSS 的 .gridwrap 保持一致）。列数必须按「实际渲染宽」算，
/// 不是按窗口宽——否则桌面档会算出 8 列，实际只有 1120px 可放。
const GRID_MAX = 1120;
function availWidth(){
  const raw = SIZES[sizeKey()][0] - railWidth() - gutter()*2;
  return Math.min(raw, GRID_MAX);
}
function columns(){
  const raw = Math.floor(availWidth() / TARGET_CARD);
  return Math.min(8, Math.max(3, raw));
}
function navMode(){ const s=sizeKey(); return s==='phone'?'bottom':(s==='tablet'?'rail':'sidebar'); }

let toastTimer=null;
function toast(msg){
  let t=el('#toast');
  if(!t){ t=document.createElement('div'); t.className='toast'; t.id='toast'; el('#screen').appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1900);
}

function card(d){
  const pct = d.seen ? Math.round(d.seen/d.eps*100) : 0;
  return '<div class="card" data-go="detail" data-id="'+d.id+'"><div class="cover">'+coverArt(d)
    +'<div class="cover-scrim"></div>'
    +(d.seen ? '<div class="resume">继续看 '+d.seen+'</div>' : '<div class="cover-badge">'+d.tags[0]+'</div>')
    +'<div class="cover-meta"><div class="cover-title">'+esc(d.title)+'</div>'
    +'<div class="cover-sub">全 '+d.eps+' 集</div></div>'
    +(d.seen ? '<div class="prog"><i style="width:'+pct+'%"></i></div>' : '')
    +'</div></div>';
}

/// Tab 页公有件：固定顶栏。r 为右侧圆钮数组，t 为标题，sub 为顶栏下的常驻副行。
/// 返回的是「顶栏 + 副行 + 一个已打开的 .scroll」——调用方负责关掉这个 .scroll。
function topbar(t, r, sub){
  const pad = sub ? 'calc(var(--toph,56px) + 52px)' : 'calc(var(--toph,56px) + 10px)';
  return '<div class="topbar"><h2>'+t+'</h2>'
    +(r||[]).join('')
    +'</div>'
    +(sub ? '<div class="subbar">'+sub+'</div>' : '')
    +'<div class="scroll" style="--bodypad:'+pad+'">';
}
const rb = (ic, act, cls) => '<div class="rnd '+(cls||'plain')+'"'
  +(act?' data-act="'+act+'"':'')+'>'+ic+'</div>';

  const list = seg===0 ? watching : (seg===1 ? done : DRAMAS.filter(x=>x.seen>0));
  const body = list.length ? list.map(x=>{
      const p=Math.round(x.seen/x.eps*100);
      const finished = x.seen>=x.eps;
      return '<div class="follow-row" data-go="detail" data-id="'+x.id+'">'
      +'<div class="follow-thumb">'+coverArt(x)+'</div>'
      +'<div class="follow-body"><div class="t">'+esc(x.title)+'</div>'

      +'<button class="pill sm">'+(finished?'重看':'继续看')+'</button></div>';}).join('')
    : emptyState(ICON.heart, seg===1?'还没有看完的剧':'还没有在追的剧',
        '在发现页点开任意一部，看过的剧会自动出现在这里，进度也会记下来。','去发现页逛逛','goHome');
  return '<div class="page" data-page="follow">'
    + topbar('追剧', [rb(ICON.more,'followMore')],
        '<div class="segmented">'+['在看','已看完','全部'].map((s,i)=>

          +'<span style="margin-left:5px;font-family:var(--mono);font-size:11px;opacity:.55">'
          +(i===0?watching.length:(i===1?done.length:DRAMAS.filter(x=>x.seen>0).length))+'</span></button>').join('')
        +'</div>')
    + '<div class="pad body col">'
    + body
    +'</div>'
    +'<div class="totop">'+ICON.up+'</div>'
    +'<div style="height:'+(navMode()==='bottom'?'110px':'30px')+'"></div></div></div></div>';

    + lrow(ICON.info,'仅 Wi-Fi 下载','仅 Wi-Fi 下载','开')
    + '</div>'
    + '<div class="sec">其他</div>'
    + '<div class="listcard">'
    + lrow(ICON.info,'设置','设置')
    + lrow(ICON.info,'关于','关于','v1.0.0')
    + lrow(ICON.info,'免责声明','免责声明')
    + '</div>'
    + '<div style="text-align:center;color:var(--silver);font-size:11.5px;margin:26px 0 0;font-family:var(--mono)">v1.0.0 · 内容均来自第三方源</div>'
    + '<div style="height:'+(navMode()==='bottom'?'150px':'50px')+'"></div></div></div></div>';
}
/// 设置类列表行：浅雾卡片内的行，图标方格 + 文字 + 右侧值/箭头
function lrow(ic, tx, key, val){
  return '<div class="row" data-act="row" data-row="'+key+'"><span class="lead">'+ic+'</span>'
    +'<span class="tx">'+tx+'</span>'
    +(val?'<span class="val">'+val+'</span>':'')
    +'<span class="chev">'+ICON.chev+'</span></div>';
}
function filterSummary(){
  const f=state.f, out=[];
  if(f.tags.length) out.push(f.tags.join('、'));
  if(f.status>0) out.push(FILTERS.status.items[f.status]);
  if(f.eps>0) out.push(FILTERS.eps.items[f.eps]);
  if(f.source>0) out.push(FILTERS.source.items[f.source]);
  out.push(FILTERS.sort.items[f.sort]);
  return out.join(' · ');
}
function filterActive(){
  const f=state.f;
  return f.tags.length>0 || f.status>0 || f.eps>0 || f.source>0;
}
function pageSearch(){
  const res = state.searched;
  // 搜索页也是 push 进来的子页，没有导航可依赖，所以自带返回钮
  let head = '<div class="pad" style="padding-top:14px"><div class="srow">'
    +'<div class="rnd plain" data-go="back">'+ICON.back+'</div>'
    +'<div class="searchbar">'
    +'<span class="i">'+ICON.search+'</span>'
    +'<input id="q" placeholder="搜索剧名、题材" value="'+esc(state.query)+'">'
    +'<span class="x" data-act="clear">'+ICON.x+'</span></div></div>';
  if(!res){
    head += '<div class="find-row" data-act="filters"><span class="ico">'+ICON.tune+'</span>'
      +'<span class="tx"><b>按条件筛选</b><span>题材、状态、集数与排序</span></span>'
      +'<span class="chev">'+ICON.chev+'</span></div>'
      +'<div class="sec">最近搜索</div>'
      +['龙王赘婿','霸总','重生','医妃'].map(w=>
        '<div class="recent-row" data-act="q" data-w="'+w+'"><span class="ico">'+ICON.clock+'</span>'
        +'<span class="w">'+w+'</span><span class="x">'+ICON.x+'</span></div>').join('');
  }else{
    head += '<div class="res-head"><span class="t">搜索结果</span>'
      +'<span class="chip" data-act="sortmenu">'+ICON.sort+' '+FILTERS.sort.items[state.f.sort]+'</span>'
      +'<span class="rnd plain" style="position:relative" data-act="filters">'+ICON.tune
      +(filterActive()?'<i class="badge-dot"></i>':'')+'</span></div>'
      +'<div class="cnt">'+DRAMAS.length+' 部剧集</div>'
      +(filterActive()?'<div class="res-sum">'+esc(filterSummary())+'</div>':'');
  }
  head += '</div>';
  const body = res
    ? '<div class="pad"><div class="grid">'+DRAMAS.map(card).join('')+'</div>'
      +'<div style="text-align:center;color:var(--silver);font-size:11.5px;padding:26px 0 0">已经看到全部结果</div>'
      +'<div style="height:40px"></div></div>'
    : '';
  return '<div class="page" data-page="search">'
    +'<div class="scroll"><div class="nav-clear" style="height:10px"></div>'+head+body
    +'<div style="height:'+(navMode()==='bottom'?'96px':'30px')+'"></div></div></div>';
}
function pageDetail(){
  const d=state.drama;
  let eps='';
  for(let i=1;i<=50;i++) eps += '<button class="ep'+(i===d.seen?' cur':(i<d.seen?' done':''))+'">'+i+'</button>';
  return '<div class="page" data-page="detail" style="--c1:'+d.c1+';--c2:'+d.c2+'">'
    +'<div class="detail-bg"><div class="detail-blur"></div><div class="detail-tint"></div><div class="detail-veil"></div></div>'
    +'<div class="detail-top"><div class="rnd glass" data-go="back">'+ICON.back+'</div><div class="sp"></div>'
    +'<div class="rnd glass">'+ICON.share+'</div><div class="rnd glass">'+ICON.more+'</div></div>'
    +'<div class="scroll"><div class="pad">'
    +'<div class="detail-head"><div class="poster">'+coverArt(d)+'</div>'
    +'<div class="detail-title"><h3>'+esc(d.title)+'</h3>'
    +'<div class="detail-tags">'+d.tags.map(t=>'<span class="chip">'+t+'</span>').join('')+'</div>'
    +'<div class="detail-meta">'+(d.status?'已完结':'连载中')+' · 全 '+d.eps+' 集</div></div></div>'
    +'<div class="actions"><button class="pill ghost" style="flex:0 0 auto;padding:0 18px">'+ICON.dl+'下载</button>'
    +'<button class="pill" data-go="player">'+(d.seen?'继续看 第'+(d.seen+1)+'集':'开始观看')+'</button></div>'
    +'<div class="synopsis">'+esc(d.syn.slice(0,84))+(d.syn.length>84?'…':'')+' <span class="more">展开</span></div>'
    +'<div class="epgroup"><span class="sec">选集</span><span class="num" style="font-size:12.5px;color:var(--graphite)">1-50 / '+d.eps+' &lt; &gt;</span></div>'
    +'<div class="epgrid">'+eps+'</div><div style="height:60px"></div></div></div></div>';
}
function pagePlayer(){
  const d=state.drama;
  return '<div class="page" data-page="player" style="--c1:'+d.c1+';--c2:'+d.c2+'">'
    +'<div class="player" id="playerBox"><div class="video"></div>'
    +'<div class="pv-center">'+ICON.play+'</div>'
    +'<div class="pv-top"><div class="rnd" data-go="back">'+ICON.back+'</div>'
    +'<div class="nm">'+esc(d.title)+' · 第 '+(d.seen+1)+' 集</div><div class="rnd">'+ICON.more+'</div></div>'
    +'<div class="pv-rail">'+pvAct(ICON.like,'1284')+pvAct(ICON.cmt,'356')+pvAct(ICON.star,'收藏')+pvAct(ICON.share,'分享')+'</div>'
    +'<div class="pv-info"><div class="t">'+esc(d.title)+'</div>'
    +'<div class="s">第 '+(d.seen+1)+' 集 / 全 '+d.eps+' 集</div>'
    +'<div class="chips"><span class="chip">选集</span><span class="chip">1.0×</span><span class="chip">1080P</span></div></div>'
    +'<div class="pv-hint">上滑看下一集</div>'
    +'<div class="pv-prog"><div class="track"><i></i></div></div>'
    +'<div class="pv-bar"><div class="b">'+ICON.play+'</div><div class="tm">02:14</div>'
    +'<div class="tr"><i></i></div><div class="tm">03:52</div><div class="b">'+ICON.more+'</div></div>'
    +'</div></div>';   /* 收 .player 与 .page */

}

function sheetHTML(){
  const f=state.f;
  const g=(key)=>{
    const cfg=FILTERS[key];
    const wrap = cfg.multi
      ? cfg.items.map((it,i)=>'<button class="chip'+(f.tags.includes(it)?' on':'')+'" data-f="'+key+'" data-i="'+i+'">'+it+'</button>').join('')
      : cfg.items.map((it,i)=>'<button class="chip'+(f[key]===i?' on':'')+'" data-f="'+key+'" data-i="'+i+'">'+it+'</button>').join('');
    return '<div class="fgroup"><div class="l">'+cfg.label+(cfg.multi?'（可多选）':'')+'</div><div class="fwrap">'+wrap+'</div></div>';
  };
  return '<div class="mask" data-act="closeSheet"><div class="sheet">'
    +'<h4>筛选<span class="r" data-act="reset">重置</span></h4>'
    +g('tags')+g('status')+g('eps')+g('sort')+g('source')
    +'<div class="sheet-foot"><button class="pill ghost" style="flex:1" data-act="closeSheet">取消</button>'
    +'<button class="pill" style="flex:1" data-act="apply">应用筛选</button></div>'
    +'</div></div>';
}

/* 从 URL query 读初始态，便于直接截图 / 分享某个组合：
   index.html?size=desktop&page=detail&theme=dark&glass=off */
(function initFromQuery(){
  const q=new URLSearchParams(location.search);
  const size=q.get('size'), page=q.get('page'), theme=q.get('theme'), glass=q.get('glass');
  if(size && SIZES[size]) document.documentElement.dataset.size=size;
  if(theme==='dark'||theme==='light') document.documentElement.dataset.theme=theme;
  if(glass==='on'||glass==='off') document.documentElement.dataset.glass=glass;
  if(page && NOTES[page]){ state.page=page; if(TAB_PAGES.indexOf(page)>=0) state.nav=page; }
})();

/* ── 渲染 ───────────────────────── */
function render(){
  const s=sizeKey(), dim=SIZES[s];
  document.documentElement.style.setProperty('--dw',dim[0]+'px');
  document.documentElement.style.setProperty('--dh',dim[1]+'px');
  document.documentElement.style.setProperty('--cols',columns());
  document.documentElement.style.setProperty('--gut',gutter()+'px');
  document.documentElement.style.setProperty('--ecols', s==='phone'?5:(s==='tablet'?8:10));
  el('#caption').textContent = dim[2];

  const mode=navMode();
  const content='<div class="content">'+pageHome()+pageRanking()+pageFollow()+pageMe()
    +pageSearch()+pageDetail()+pagePlayer()+(state.sheet?sheetHTML():'')+'</div>';
  const nav = navVisible();
  const cls = 'shell' + (nav && mode !== 'bottom' ? ' hasrail' : '');
  el('#screen').innerHTML = '<div class="'+cls+'" style="--railpad:'+(railW()+24)+'px">'
    + (nav && mode !== 'bottom' ? navRail() : '')
    + content
    + (nav && mode === 'bottom' ? navBottom() : '')
    + '</div>';

  // 点击处理器绑定在 .screen 上（它不被重建），无需重新绑定
  document.querySelectorAll('[data-page]').forEach(p=>p.classList.toggle('on',p.dataset.page===state.page));
  const pb=el('#playerBox'); if(pb) pb.classList.toggle('landscape', s==='desktop');
  el('#notes').innerHTML = notesHTML();
  bindScroll();
}
function notesHTML(){
  const n=NOTES[state.page]; const c=columns(); const av=availWidth();
  return '<div class="kicker">设计要点</div><h5>'+n.t+'</h5>'
    +'<div class="density">可用宽 <b>'+av+'</b>pt ÷ 目标卡宽 <b>'+TARGET_CARD+'</b>pt = '
    +(av/TARGET_CARD).toFixed(2)+' → <b>'+c+' 列</b>（下限 3 / 上限 8）<br>'
    +'导航：<b>'+({bottom:'浮起玻璃 Tab 条',rail:'iPadOS 侧栏 220pt',sidebar:'iPadOS 侧栏 260pt'}[navMode()])+'</b>'
    +' · 本页<b>'+(navVisible()?'显示':'隐藏')+'</b></div>'
    +'<ul>'+n.l.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
}
function bindScroll(){
  // 顶栏全程固定，不再随滚动形变，因此这里没有监听。
  // 返回顶部按钮在滚动超过一屏时出现。
  document.querySelectorAll('.scroll').forEach(h=>{
    if(h.dataset.bound) return; h.dataset.bound='1';
    const b=h.closest('.page').querySelector('.totop');
    if(!b) return;
    h.addEventListener('scroll',()=>b.classList.toggle('on',h.scrollTop>600),{passive:true});
    b.addEventListener('click',()=>h.scrollTo({top:0,behavior:'smooth'}));
  });
}

function seg(id,attr,after){
  el('#'+id).addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    document.documentElement.dataset[attr]=b.dataset[attr];
    el('#'+id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    if(after) after();
  });
}
seg('segSize','size',()=>render());
seg('segTheme','theme',()=>render());
seg('segGlass','glass',()=>{});
/// 把 URL 初始态同步到顶部开关的选中态
function syncSegs(){
  const d=document.documentElement.dataset;
  [['segSize','size'],['segTheme','theme'],['segGlass','glass']].forEach(pair=>{
    el('#'+pair[0]).querySelectorAll('button').forEach(b=>
      b.setAttribute('aria-pressed',String(b.dataset[pair[1]]===d[pair[1]])));
  });
  el('#segPage').querySelectorAll('button').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));
}
el('#segPage').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.page=b.dataset.page;
  if(['home','ranking','follow','me'].includes(state.page)) state.nav=state.page;
  el('#segPage').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();
});

el('#screen').addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ state.nav=tab.dataset.tab; state.page=tab.dataset.tab; render(); return; }
  const rw=e.target.closest('[data-rankwin]');
  if(rw){ state.rankWin=+rw.dataset.rankwin; render(); return; }
  const fs=e.target.closest('[data-followseg]');
  if(fs){ state.followSeg=+fs.dataset.followseg; render(); return; }
  const act=e.target.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='filters'){ state.sheet=true; render(); return; }
    if(a==='closeSheet'){ state.sheet=false; render(); return; }
    if(a==='reset'){ state.f={tags:[],status:0,eps:0,sort:0,source:0}; render(); return; }
    if(a==='apply'){ state.sheet=false; state.searched=true; state.page='search'; render(); return; }
    if(a==='clear'){ state.query=''; state.searched=false; render(); return; }
    if(a==='q'){ state.query=act.dataset.w; state.searched=true; state.page='search'; render(); return; }
    if(a==='openSearch'){ state.page='search'; render(); return; }
    if(a==='goHome'){ state.page='home'; state.nav='home'; render(); return; }
    // 以下三项原型里只做反馈提示，不实现真实功能
    if(a==='source'||a==='followMore'||a==='settings'||a==='sortmenu'||a==='row'){
      toast(TOAST[a]||((act.dataset.row?act.dataset.row+'：':'')+'原型中未实现'));
      return;
    }
  }
  const f=e.target.closest('[data-f]');
  if(f){
    const k=f.dataset.f, i=+f.dataset.i;
    if(FILTERS[k].multi){
      const v=FILTERS[k].items[i];
      state.f.tags = state.f.tags.includes(v) ? state.f.tags.filter(t=>t!==v) : [...state.f.tags,v];
    } else state.f[k]=i;
    render(); return;
  }
  const go=e.target.closest('[data-go]');
  if(go){
    const g=go.dataset.go;
    if(g==='detail'){ state.drama=DRAMAS.find(x=>x.id===+go.dataset.id)||DRAMAS[0]; state.page='detail'; }
    else if(g==='player') state.page='player';
    else if(g==='search') state.page='search';
    else if(g==='back'){ state.page = state.nav || 'home'; }
    render();
  }
});
el('#screen').addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='q'){ state.query=e.target.value; state.searched=true; render(); }
});

render();
syncSegs();
</script>
</body>
</html>
