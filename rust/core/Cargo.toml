[package]
name = "drama_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "红果短剧客户端 Rust 核心（窄 C ABI：drama_request / drama_free）"
# cargo-deny 门禁要求每个包声明许可证；本工程按 MIT OR Apache-2.0 双许可（与 Rust 生态惯例一致）。
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "drama_core"
# native_toolchain_rust 要求同时产出 staticlib 与 cdylib（lib 仅供 cargo test）
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
once_cell = "1"
# W2 接入：HTTP 引擎 + 源抽象 + 红果 SSR 解析。
# 说明： 期望 reqwest 0.13，但 0.13 尚未发布；实际锁定可用的最近版本（见 Cargo.lock）。
# reqwest 用 async（不优先阻塞版），由 http.rs 的全局 Tokio 运行时驱动。
reqwest = { version = "0.12", features = ["json", "gzip"] }
# `net` 供离线端到端测试起本机测速服务器（见 download.rs 的 tests）。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
# 在途读取消原语：`CancellationToken`（`tokio_util::sync`， cancelRead）。
# 注意：tokio-util 0.7.20 的 `sync` 模块**没有任何 feature gate**（`src/lib.rs: pub mod sync;`），
# 故不声明任何 feature；此前误写 `features = ["sync"]` 会让依赖解析直接失败（0.7 无该 feature 名）。
tokio-util = "0.7"
# `_ROUTER_DATA` 定位正则 + URL/host 规范化。
regex = "1"
url = "2"
# R1 黄果试点：HTML 抓取（CSS 选择器 over html5ever；ISC 许可，deny allow-list 已覆盖）。
scraper = "0.27"
md5 = "0.8.1"
base64 = "0.23.1"
aes = "0.9.3"
ctr = "0.10.1"
sm3 = "0.5.0"
sha2 = "0.11.1"
cbc = "0.2.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
