[package]
name = "drama_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "红果短剧客户端 Rust 核心（窄 C ABI：drama_request / drama_free）"
# cargo-deny 门禁要求每个包声明许可证；本工程按 MIT OR Apache-2.0 双许可（与 Rust 生态惯例一致）。
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "drama_core"
# native_toolchain_rust 要求同时产出 staticlib 与 cdylib（lib 仅供 cargo test）
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
drama-engine.workspace = true
drama-types.workspace = true
serde_json.workspace = true
once_cell.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# CLI 通过此 feature 复用 `request_text`（同一 dispatch 路径）。
cli = []
