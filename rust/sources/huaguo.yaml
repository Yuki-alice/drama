schema: 1
id: huaguo
name: 花果
version: 0.1.0
author: official
homepage: https://www.zywest263.com
base: https://www.zywest263.com
user_agent: desktop
caps:
  catalog: true
  detail: true
  playback: true
ops:
  catalog:
    request:
      url: "{{base}}/"
    items: "css:[class*='vodlist__item']"
    map:
      id:
        from: "a@href"
        filters:
          - 're:/([0-9]+)\.html:1'
      title:
        from: "a@title"
      cover:
        from: "img@data-original"
  detail:
    request:
      url: "{{base}}/zywview/{{id}}.html"
    identity_check: false
    map:
      id:
        from: "{{id}}"
      title:
        from: "css:h1"
      cover:
        from: "img@data-original"
    chapters:
      items: "css:[class*='playlist'] a, [class*='play-list'] a"
      title_template: "第{{index}}集"
      url:
        from: "a@href"
      index:
        from: "a"
        filters:
          - 're:第\\s*([0-9]+)\\s*集:1'
  playback:
    request:
      url: "{{base}}/zywplay/{{id}}-0-0.html"
    extract:
      type: regex
      pattern: '(https?://[^"''\s]+\.m3u8)'
      group: 1
    referer: "{{base}}/"
