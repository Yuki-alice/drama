[workspace]
resolver = "3"
members = [
    "core",
    "crates/drama-types",
    "crates/drama-net",
    "crates/drama-store",
    "crates/drama-rules",
    "crates/drama-gateway",
    "crates/drama-source-hongguo",
    "crates/drama-download",
    "crates/drama-lan",
    "crates/drama-engine",
    "crates/drama-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# ── 内部 crate ────────────────────────────────────────────────
drama-types = { path = "crates/drama-types" }
drama-net = { path = "crates/drama-net" }
drama-store = { path = "crates/drama-store" }
drama-rules = { path = "crates/drama-rules" }
drama-gateway = { path = "crates/drama-gateway" }
drama-source-hongguo = { path = "crates/drama-source-hongguo" }
drama-download = { path = "crates/drama-download" }
drama-lan = { path = "crates/drama-lan" }
drama-engine = { path = "crates/drama-engine" }

# ── 外部依赖 ──────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "fs",
    "io-util",
    "net",
    "signal",
] }
tokio-util = "0.7"
regex = "1"
url = "2"
scraper = "0.27"
# 进程间文件锁（避免 unsafe 手写 flock）。
fs2 = "0.4"
md5 = "0.8.1"
base64 = "0.23.1"
aes = "0.9.3"
ctr = "0.10.1"
sm3 = "0.5.0"
sha2 = "0.11.1"
# `block-padding` 提供 `encrypt_padded_mut::<NoPadding>`（Argus 信封要自己控制填充）。
cbc = { version = "0.2.1", features = ["block-padding"] }
# 规则扩展源的作者态格式（YAML），分发态为规范化 JSON。
serde_yaml_ng = "0.10"
# LAN：mDNS 发现 + 自签证书。
mdns-sd = "0.21"
rcgen = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.release.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
# `expect()` 在锁中毒与「不可能失败」的构建路径上是正确的选择（panic 比静默降级好）。
# 真正的禁令是 `unwrap()`：它连错误信息都没有。
unwrap_used = "warn"
expect_used = "allow"
# 测试代码里 `unwrap()` / `unwrap_err()` 是标准写法（断言失败即失败），不适用上述禁令。
field_reassign_with_default = "allow"

