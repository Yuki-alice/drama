# ffigen 配置：由 rust/core 的 C ABI 头文件生成 Dart FFI 绑定。
#
# 在**仓库根**执行（本配置与 Dart 包根同目录）：
#   dart run ffigen --config ffigen.yaml
# 或走包装入口：dart run tool/ffigen.dart
#
# ⚠️ 生成结果**不能直接使用**：ffigen 产出的是 `DynamicLibrary.lookup` 风格
# （pkg:DramaCoreBindings 类 + 构造函数注入 DynamicLibrary），而本项目走
# **native assets**，要求 `@Native` 外部函数形式（资源名由 `hook/build.dart`
# 的 assetName 决定）。两者不兼容。
#
# 因此 `lib/data/services/drama_core_bindings.dart` **保持手写**；
# 本配置与 tool/ffigen.dart 仅作为「头文件签名」的校对手段：
# 手改 C ABI 后跑一次 ffigen，比对其输出确认参数/返回类型与头文件一致，
# 然后把改动落到手写文件上，最后 `git checkout` 丢弃生成结果。
name: DramaCoreBindings
description: drama_request / drama_free 的 Dart FFI 绑定
output: 'lib/data/services/drama_core_bindings.dart'
headers:
  entry-points:
    # 相对本配置所在目录（= Dart 包根 = 仓库根）。
    - 'rust/core/drama_core.h'
  include-directives:
    - '**/drama_core.h'
functions:
  include:
    - drama_request
    - drama_free
