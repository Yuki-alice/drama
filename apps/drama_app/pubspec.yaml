name: drama_app
description: "红果短剧第三方客户端（MVP，Android + Windows）。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

# 依赖版本纪律见 docs/ARCH.md §2。A 类为已实证版本；本机 Flutter 3.41.5 / Dart 3.11.3，
# 下列带 "降级" 注释的项因本机 SDK 约束无法使用文档基线的更高版本，已在 EVIDENCE §19 留痕。
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- A 类：媒体栈 / 玻璃 UI / FFI / 平台能力（已实证） ---
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  liquid_glass_widgets: 1.13.0
  ffi: ^2.2.0
  crypto: ^3.0.7
  # 降级：11.x 要求 Dart SDK >=3.12.0，本机 3.11.3
  flutter_foreground_task: 10.0.0
  window_manager: ^0.5.1
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

  # --- B 类：状态管理（Riverpod 3）/ 路由 / 本地化 / 存储 ---
  flutter_riverpod: 3.2.1
  riverpod_annotation: 4.0.2
  go_router: ^17.5.0
  intl: ^0.20.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # --- 构建钩子（hook/build.dart 直接 import，故置于 dependencies） ---
  hooks: ^2.0.2
  # 降级：2.x 经 hooks→record_use 要求 meta ^1.19，与 Flutter 3.41.5 冲突
  code_assets: ^1.2.1
  # 降级：1.0.5+ 同上，与 meta 冲突
  native_toolchain_rust: 1.0.4+0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.15.1
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.13.0

  # --- FFI 绑定生成 ---
  ffigen: ^21.0.0

flutter:
  uses-material-design: true
