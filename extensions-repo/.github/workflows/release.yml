name: Validate extensions

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts and headers
        run: python3 tools/build.py --check
      - name: Regenerate index
        run: |
          python3 tools/build.py \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/extensions"
      - name: Ensure index.json is current
        run: git diff --exit-code index.json
